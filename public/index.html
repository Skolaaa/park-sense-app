<!DOCTYPE html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>ParkSense — read any Sydney parking sign</title>
    <meta
      name="description"
      content="Photograph a Sydney parking sign and get a straight answer: can you park here right now, for how long, and what it costs if you get it wrong."
    />

    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:type" content="website" />

      property="og:description"
      content="Photograph a Sydney parking sign and get a straight answer: can you park here right now, for how long, and what it costs if you get it wrong."
