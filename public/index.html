<!DOCTYPE html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>ParkSense — read any Sydney parking sign</title>
    <meta
      name="description"
      content="Photograph a Sydney parking sign and get a straight answer: can you park here right now, for how long, and what it costs if you get it wrong."
    />

    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Status bar matches the app ground in each theme. -->
    <meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ParkSense" />
    <meta
      property="og:description"
      content="Photograph a Sydney parking sign and get a straight answer: can you park here right now, for how long, and what it costs if you get it wrong."
    />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <noscript>ParkSense needs JavaScript enabled to read parking signs.</noscript>
    <div id="root"></div>
  </body>
</html>
