name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Build
        run: CI=true npm run build

      # `npm run build` already triggers this via the postbuild hook; running it
      # explicitly makes a credential leak read as its own failed step rather
      # than as a confusing build failure.
      - name: Scan build output for secrets
        run: npm run security:scan
